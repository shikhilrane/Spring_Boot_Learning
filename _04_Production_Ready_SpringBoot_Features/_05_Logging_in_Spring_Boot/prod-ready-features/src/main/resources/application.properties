spring.application.name=prod-ready-features

# Hibernate Configurations
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/prod-ready-features?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Shikhil@4

# Devtools Configurations
spring.devtools.restart.enabled=false
#spring.devtools.restart.exclude=src/main/java/com/shikhilrane/shikhil/prod_ready_features/dto/**
#spring.devtools.restart.pollInterval=20
#spring.devtools.restart.quietPeriod=10

server.port=9000

employeeService.base.url=http://localhost:8080

# Logging Configurations
logging.level.com.shikhilrane.shikhil.prod_ready_features.clients=TRACE
#logging.level.com.shikhilrane.shikhil.prod_ready_features.config=TRACE
#logging.level.root=TRACE   // Should not be use because these will print lots of logs
spring.output.ansi.enabled=ALWAYS
logging.pattern.console=%clr(%d{dd-MM-yyyy HH:mm:ss}){blue} [%level] [%t] [%c{1}] --- %m%n
logging.file.name=application.log
logging.pattern.file=%d{dd-MM-yyyy HH:mm:ss} [%level] [%t] [%c{1}] --- %m%n
logging.config=classpath:logback-spring.xml